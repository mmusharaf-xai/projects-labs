appId: host.exp.Exponent
name: Login Flow
---

# Generate a random ID — sign up a fresh user first, then log in
- runScript:
    file: ../gen_id.js
    env:
      PREFIX: "login"

# Wait for the login screen to fully render
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 30000

# --- Step 1: Create account so we have credentials to log in with ---
- tapOn:
    id: "navigate-signup"
- assertVisible: "Create Account"

- tapOn:
    id: "fullname-input"
- inputText: "Teacher ${output.RANDOM_ID}"
- pressKey: "Enter"

- tapOn:
    id: "email-input"
- inputText: "${output.RANDOM_ID}@e2e.com"
- pressKey: "Enter"

- tapOn:
    id: "password-input"
- inputText: "Test@1234"
- pressKey: "Enter"

- tapOn:
    id: "signup-button"

- extendedWaitUntil:
    visible: "My Schools"
    timeout: 10000

# Log out after signup
- tapOn:
    id: "account-settings-button"
- extendedWaitUntil:
    visible: "Account Settings"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "logout-button"
- extendedWaitUntil:
    visible: "Are you sure you want to log out?"
    timeout: 3000
- tapOn:
    text: "Log Out"
    index: 1

# --- Step 2: Now test the actual login ---
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 30000

- tapOn:
    id: "email-input"
- inputText: "${output.RANDOM_ID}@e2e.com"
- pressKey: "Enter"

- tapOn:
    id: "password-input"
- inputText: "Test@1234"
- pressKey: "Enter"

- tapOn:
    id: "login-button"

# Verify we land on the home screen
- extendedWaitUntil:
    visible: "My Schools"
    timeout: 10000