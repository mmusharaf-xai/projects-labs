appId: host.exp.Exponent
name: Signup Flow
---

# Generate a random ID so each run creates a unique user
- runScript:
    file: ../gen_id.js
    env:
      PREFIX: "signup"

# Wait for the login screen to fully render
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 30000

# Navigate to signup screen
- tapOn:
    id: "navigate-signup"

# Verify we're on the signup screen
- assertVisible: "Create Account"

# Fill in full name
- tapOn:
    id: "fullname-input"
- inputText: "Teacher ${output.RANDOM_ID}"
- pressKey: "Enter"

# Fill in email
- tapOn:
    id: "email-input"
- inputText: "${output.RANDOM_ID}@e2e.com"
- pressKey: "Enter"

# Fill in password
- tapOn:
    id: "password-input"
- inputText: "Test@1234"
- pressKey: "Enter"

# Submit
- tapOn:
    id: "signup-button"

# Verify we land on the home screen
- extendedWaitUntil:
    visible: "My Schools"
    timeout: 10000

# Log out so subsequent flows start from login screen
- tapOn:
    id: "account-settings-button"
- extendedWaitUntil:
    visible: "Account Settings"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "logout-button"
- extendedWaitUntil:
    visible: "Are you sure you want to log out?"
    timeout: 3000
- tapOn:
    text: "Log Out"
    index: 1